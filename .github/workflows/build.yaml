name: Build Maven artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25
        cache: 'maven'

    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v2

    # UI tests (Selenide acceptance tests, tagged with @Tag("UI")) are excluded here.
    # They run once a day or on demand, see ui-tests.yaml.
    - name: Build with Maven
      run: ./mvnw -Pci -B "-DexcludedGroups=UI" verify
